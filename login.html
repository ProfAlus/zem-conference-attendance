<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Conference Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="modulepreload" href="js/core/config.js">
<link rel="modulepreload" href="js/core/api.js">
<link rel="modulepreload" href="js/core/auth.js">
<link rel="modulepreload" href="js/core/toast.js">
<link rel="modulepreload" href="js/core/modal.js">
<link rel="modulepreload" href="js/core/utils.js">
<link rel="modulepreload" href="js/core/theme.js">
<link rel="modulepreload" href="js/core/offline.js">
<link rel="modulepreload" href="js/core/nav.js">
</head>
<body>
  <div class="public-page">
    <div class="public-card">
      <div class="public-brand">
        <span class="dot" data-brand-logo="public"></span>
        <h1>Team sign in</h1>
        <p class="text-muted">For volunteers and administrators</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="name">Your name</label>
          <input class="input" id="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="passcode">Team passcode</label>
          <input class="input" id="passcode" type="password" required autocomplete="current-password">
          <div class="hint">Ask your conference coordinator if you don't have this.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket"></i> Sign in
        </button>
      </form>

      <p class="text-muted" style="text-align:center; font-size: 0.85rem; margin-top: 16px;">
        <a href="index.html">&larr; Back</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/modules/login.js"></script>
</body>
</html>

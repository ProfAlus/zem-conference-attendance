<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questions &amp; Testimonies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="modulepreload" href="js/core/config.js">
<link rel="modulepreload" href="js/core/api.js">
<link rel="modulepreload" href="js/core/utils.js">
<link rel="modulepreload" href="js/core/theme.js">
</head>
<body>
  <div style="min-height:100vh; background: var(--color-cream-50);">
    <div class="container" style="padding-top: var(--sp-7); padding-bottom: var(--sp-7); max-width: 700px;">
      <div class="public-brand" style="text-align:center; margin-bottom: var(--sp-5);">
        <span class="dot" data-brand-logo="public"></span>
        <h1 id="confName" style="margin-bottom:4px;">Questions &amp; Testimonies</h1>
        <p class="text-muted">Ask a question or share what God has done.</p>
      </div>

      <div class="flex gap-2 mb-4" style="justify-content:center;">
        <button class="btn btn-primary" id="tabQuestion" data-type="Question"><i class="fa-solid fa-circle-question"></i> Questions</button>
        <button class="btn btn-outline" id="tabTestimony" data-type="Testimony"><i class="fa-solid fa-hands-praying"></i> Testimonies</button>
      </div>

      <div class="card mb-5">
        <h3 id="formTitle" style="margin-bottom:14px;">Ask a question</h3>
        <div id="formClosedNotice" class="card card-tight" style="display:none; background: var(--color-warning-tint); text-align:center;">
          <i class="fa-solid fa-lock" style="margin-bottom:6px;"></i>
          <p id="formClosedMessage" style="margin:0; font-weight:600;">Submissions are currently closed.</p>
        </div>
        <form id="entryForm">
          <div class="field">
            <label for="entryName">Your name</label>
            <input class="input" id="entryName" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="entryContent" id="contentLabel">Your question</label>
            <textarea class="input" id="entryContent" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <i class="fa-solid fa-paper-plane"></i> Submit
          </button>
          <p class="text-muted" style="text-align:center; font-size:0.8rem; margin-top:10px;" id="reviewNotice">
            Submissions are reviewed before appearing below.
          </p>
        </form>
      </div>

      <h3 id="listTitle" style="margin-bottom:14px;">Recent questions</h3>
      <div id="entriesList"></div>

      <p style="text-align:center; margin-top: var(--sp-6);"><a href="materials.html">&larr; Back to Materials</a></p>
    </div>
  </div>

  <script type="module" src="js/modules/voices.js"></script>
</body>
</html>

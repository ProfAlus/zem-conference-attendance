<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summit Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="modulepreload" href="js/core/config.js">
<link rel="modulepreload" href="js/core/api.js">
<link rel="modulepreload" href="js/core/utils.js">
<link rel="modulepreload" href="js/core/theme.js">
</head>
<body>
  <div style="min-height:100vh; background: var(--color-cream-50);">
    <div class="container" style="padding-top: var(--sp-7); padding-bottom: var(--sp-7); max-width: 800px;">
      <div style="text-align:center; margin-bottom: var(--sp-5);">
        <span class="dot" data-brand-logo="public" style="width:12px;height:12px;border-radius:50%;background:var(--color-coral);display:inline-block;margin-bottom:8px;"></span>
        <h1 id="confName" style="margin-bottom:4px;">Summit Schedule</h1>
        <p class="text-muted">Search or browse the full day-by-day programme.</p>
      </div>

      <div class="field" style="margin-bottom: var(--sp-5);">
        <input class="input" id="searchBox" placeholder="Search sessions… e.g. &quot;Bible Study&quot;, &quot;entrepreneurship&quot;, &quot;Friday&quot;">
      </div>

      <div class="flex flex-wrap gap-2 mb-4" id="dayTabs"></div>

      <div id="scheduleList"></div>

      <p style="text-align:center; margin-top: var(--sp-6);"><a href="materials.html">&larr; Back to Materials</a></p>
    </div>
  </div>

  <script type="module" src="js/modules/schedule.js"></script>
</body>
</html>
